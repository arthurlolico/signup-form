<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="left-side">
        <img class="left-side-background-image" src="/img/plant.png">
        <div class ="odin-part">
            <img class="odin-logo" src="/img/odin.png">
            <div class="odin-text">ODIN</div>
        </div>
        <div class="credits">
            Photo by <span class="underline">Halie West</span> on <span class="underline">Unsplash</span>
        </div>
    </div>
    <div class="right-side">
        <div class="right-side-upper-part">
            <div>This is not a real online service! You know you need something <br /> like this in your life to help you realize your deepest dreams.<br /> Sign up <i>now</i> to get started.</div>
            <div>You <i>know</i> you want to.</div>
        </div>
        <div class="right-side-mid-part">
            <div class="righ-side-hero-cta">Let's do this!</div>
            <form action="example.com/path" method="post">
                <div class="form-letf-side">
                    <div><label for="first-name">FIRST NAME</label></div>
                    <input type="text" required id="first-name">
                    <div><label for="email">EMAIL</label></div>
                    <input type="email" required id="email">
                    <div><label for="password">PASSWORD</label></div>
                    <input type="password" required id="password">
                </div>
                <div class="form-right-side">
                    <div><label for="last-name">LAST NAME</label></div>
                    <input type="text" required id="last-name">
                    <div><label for="phone-number">PHONE NUMBER</label></div>
                    <input type="text" required id="phone-number">
                    <div><label for="confirm-password">CONFIRM PASSWORD</label></div>
                    <input type="password" required id="confirm-password">
                </div>
            </form>
        </div>
        <div class="right-side-lower-part">
            <button type="submit">Create Account</button>
            <div class="right-side-log-in-message">Already have an account? <a href="www.google.com">Log in</a></div>
        </div>
    </div>
</body>
</html>
